    <style>

            --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9;

        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 15px; line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center; margin-bottom: 25px; padding: 25px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); position: sticky; top: 0; z-index: 100;

        h1 { color: var(--accent-color); margin: 0 0 10px 0; font-size: 1.8rem; }
        p.sub { color: #94a3b8; margin: 0; font-size: 0.95rem; }
        .card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { color: var(--category-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-top: 0; font-size: 1.3rem; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 900px; }
        th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; vertical-align: middle; }
        th { background-color: #0284c7; color: white; font-weight: 600; }
        tr:hover { background-color: #273548; }
        .click-to-copy {
            background-color: var(--code-bg); color: #38bdf8; padding: 8px 12px; border-radius: 6px;
            font-family: 'Consolas', monospace; direction: ltr; text-align: left; display: block; font-size: 0.85rem; cursor: pointer; border: 1px dashed var(--border-color); transition: all 0.2s ease; margin-top: 6px; word-break: break-all;
        }
        .click-to-copy:hover { border-color: var(--accent-color); background-color: #111c34; }
        .click-to-copy.copied { background-color: var(--success-color) !important; color: white !important; border-style: solid; border-color: var(--success-color); }
        .badge { background-color: #0369a1; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-family: monospace; white-space: nowrap; display: inline-block; }
        .tool-badge { background-color: #475569; color: #e2e8f0; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; }
        .stats { margin-top: 15px; font-weight: bold; color: #10b981; }
        footer { text-align: center; color: #64748b; margin-top: 30px; font-size: 0.9em; padding-bottom: 30px; }
    </style>
</head>

            { c: "۹. رمزنگاری ضعیف (CRYP)", i: "WSTG-CRYP-03", t: "کانال غیرامن (Insecure Channel)", tl: "Browser", p: "عدم ریدایرکت اجباری HTTP به HTTPS برای پنل لاگین." },

            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-01", t: "اعتبارسنجی منطق داده", tl: "Burp", p: "quantity=-5 یا اعشاری وارد کردن تعداد سبد خرید." },
            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-02", t: "جعل درخواست", tl: "Browser(F12)", p: "دستکاری <input type='hidden' name='price' value='1'>" },
            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-03", t: "تست یکپارچگی", tl: "Burp", p: "دور زدن چک‌سام (Checksum) در اپلیکیشن‌های مالی." },
            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-04", t: "مسائل زمانی (Race Condition)", tl: "Turbo Intruder", p: "استفاده همزمان ده‌ها درخواست از یک کد تخفیف یکبار مصرف." },
            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-05", t: "تعداد دفعات استفاده", tl: "Manual", p: "استفاده مجدد از یک توکن یا OTP که قبلاً مصرف شده است." },

            { c: "۱۰. منطق تجاری (BUSL)", i: "WSTG-BUSL-08", t: "فایل‌های غیرمنتظره", tl: "Burp", p: "آپلود فایل .exe یا اسکریپت در فیلدی که فقط PDF می‌خواهد." },

            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-05", t: "تزریق CSS", tl: "Browser", p: "تزریق استایل برای سرقت دیتا: input[value^='a'] { background: url('...'); }" },
            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-06", t: "دستکاری منابع کلاینت", tl: "Burp", p: "تغییر آدرس فایل‌های JS لود شده در صفحه به سرور مهاجم." },

            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-08", t: "Cross Site Flashing", tl: "Manual", p: "(منسوخ شده) بررسی فایل‌های آسیب‌پذیر فلش پلیر (.swf)." },

            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-10", t: "آسیب‌پذیری WebSockets", tl: "Burp CSWSH", p: "سرقت دیتا یا اجرای XSS درون ارتباطات زنده (Real-time Socket)." },
            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-11", t: "Web Messaging", tl: "Console", p: "window.postMessage('malicious data', '*');" },
            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-12", t: "داده‌های Local Storage", tl: "Console", p: "console.log(localStorage.getItem('access_token'));" },
            { c: "۱۱. سمت کلاینت (CLNT)", i: "WSTG-CLNT-13", t: "نشت اطلاعات CSI", tl: "Manual", p: "استخراج اطلاعات از طریق JSONP یا Endpointهای بدون احراز هویت." }
        ];

        // منطق ایجاد گرافیک صفحه از روی دیتابیس
        const appDiv = document.getElementById('app');
        document.getElementById('stats').innerText = `تعداد کل تست‌های بارگذاری شده: ${db.length} مورد`;

        // گروه‌بندی داده‌ها بر اساس دسته‌بندی
        const categories = {};
        db.forEach(item => {
            if (!categories[item.c]) categories[item.c] = [];
            categories[item.c].push(item);
        });

        // تولید HTML نهایی
        let htmlContent = '';
        for (const [catName, tests] of Object.entries(categories)) {
            htmlContent += `
                <div class="card">
                    <h2>${catName}</h2>
                    <div class="table-responsive">
                        <table>
                            <tr>
                                <th style="width: 12%;">شناسه OWASP</th>
                                <th style="width: 18%;">عنوان تست</th>
                                <th style="width: 12%;">ابزار/روش</th>
                                <th style="width: 58%;">سناریو و پی‌لود / دستور عملیاتی</th>
                            </tr>
            `;
            tests.forEach(test => {
                htmlContent += `
                            <tr>
                                <td><span class="badge">${test.i}</span></td>
                                <td><strong>${test.t}</strong></td>
                                <td><span class="tool-badge">${test.tl}</span></td>
                                <td>
                                    <div class="click-to-copy" onclick="copySnippet(this)">${test.p.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                                </td>
                            </tr>
                `;
            });
            htmlContent += `
                        </table>
                    </div>
                </div>
            `;
        }

        appDiv.innerHTML = htmlContent;

        // تابع کپی هوشمند
        window.copySnippet = function(element) {
            const text = element.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = element.innerHTML;
                element.innerHTML = 'کپی شد! ✓';
                element.classList.add('copied');
                setTimeout(() => {
                    element.innerHTML = originalHTML;
                    element.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                alert('خطا در کپی کردن متن! دسترسی کلیپ‌بورد را بررسی کنید.');
            });
        };
    </script>
